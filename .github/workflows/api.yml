name: API checks

on:
  push:
    branches: ["**"]
    paths:
      - 'docs/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'docs/api/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  openapi:
    uses: veraison/ci/.github/workflows/openapi.yml@main
    with:
      specs: 'docs/api/ratsd.yaml'
